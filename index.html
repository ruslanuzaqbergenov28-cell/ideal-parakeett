<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:18px 16px 36px}
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 2px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-bottom:-1px}

select,input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:96px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg{display:flex;gap:8px;margin:10px 0}
.chip{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:9px;font:inherit;font-size:14px;cursor:pointer}

.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 8px}
.goal{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:12px 2px 0}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;margin-bottom:14px}
.lang{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.word{font-size:clamp(22px,6.5vw,28px);font-weight:600;line-height:1.3;word-break:break-word}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.star{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--acc)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{width:100%;text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}

.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:400;font-size:14px;padding:10px}
.dng{color:var(--bad)}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}
.msg b{display:block;font-size:17px;color:var(--ink);margin-top:2px}
.msg span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
input.ok{border-color:var(--ok)}input.bad{border-color:var(--bad)}
.tb{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;flex-direction:column;gap:4px;font-size:15px}
.hint{color:var(--muted);font-size:13px}
.done{text-align:center;padding:32px 12px}
.done b{font-size:17px;font-weight:600;line-height:1.5}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;display:flex;flex-direction:column;gap:9px}
.box h3{margin:0;font-size:15px}
.wr{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px}
.wr button{border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:10px;cursor:pointer}
.lrow{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
.lrow .t{flex:1;min-width:0}
.lrow b{display:block;word-break:break-word}
.lrow span{display:block;color:var(--muted);font-size:14px}
.lrow button{background:none;border:0;font-size:19px;cursor:pointer;color:var(--acc)}
.gh{margin:22px 0 2px;font-size:13px;letter-spacing:.05em;color:var(--acc);font-weight:600}
.gap{margin-top:8px}
:root{--warn:#b7791f;--warnbg:#f6efe0;--vio:#7c5cbf}

.t-hero{padding:18px 16px;border-radius:16px;color:var(--accink);background:linear-gradient(135deg,var(--acc),var(--vio));margin-bottom:6px}
.t-h1{font-size:19px;font-weight:700;text-align:center}.t-hero .t-h1{text-align:left}
.t-sub{font-size:13px;opacity:.9;margin-top:4px;line-height:1.45}.t-last{margin-top:10px;font-size:12px;background:rgba(255,255,255,.18);display:inline-block;padding:4px 10px;border-radius:99px}

.t-q{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.t-q::-webkit-scrollbar{display:none}
.t-qb{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.t-g{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.t-tile{position:relative;aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.t-tile.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.t-tile i{position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.t-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.t-pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--okbg);color:var(--ok)}

.t-sb.on{background:var(--c);border-color:var(--c);color:var(--accink);font-weight:600}
.t-nm{display:flex;gap:8px;margin-top:10px}.t-inp{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}

.t-qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.t-qm{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.t-lv{background:var(--c);color:var(--accink);padding:2px 9px;border-radius:99px;font-weight:600}
.t-qt{font-size:19px;line-height:1.5;font-weight:500}.t-blank{color:var(--acc);font-weight:700;letter-spacing:2px;margin:0 4px}

.t-sh{background:var(--card);color:var(--ink);border:1px solid var(--acc)}
.t-ta{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:13px}
.t-br{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}.t-br span:last-child{text-align:right;color:var(--muted)}
.t-bt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.t-bt i{display:block;height:100%;border-radius:6px}
.mi{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px;font-size:15px}.mi .x{color:var(--bad)}.mi .v{color:var(--ok)}
.t-score{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:6px 0 10px;font-size:14px}.t-vs{font-size:12px;color:var(--muted)}
.t-p{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-p.p0.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}.t-p.p1.on{background:var(--vio);color:#fff;border-color:var(--vio)}
.t-turn{text-align:center;font-weight:600;font-size:14px;padding:8px;border-radius:10px;margin-bottom:10px;background:var(--acc);color:var(--accink)}.t-turn.p1{background:var(--vio);color:#fff}
.t-pass{text-align:center;padding:30px 10px}.t-big{font-size:48px;margin-bottom:6px}
.t-rv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.t-rc{padding:10px 12px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;gap:3px}.t-rc.ok{background:var(--okbg);color:var(--ok)}.t-rc.bad{background:var(--badbg);color:var(--bad)}.t-rc b{color:var(--ink)}
.t-vsr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.t-vc{text-align:center;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card)}.t-vc.win{border-color:var(--warn);background:var(--warnbg)}.t-vn{font-size:30px;font-weight:700;margin:4px 0}

function donut(p){const c=2*Math.PI*52,col=p>=80?"var(--ok)":p>=50?"var(--warn)":"var(--bad)";return '<svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="52" fill="none" stroke-width="10" style="stroke:var(--line)"/><circle cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(c*p/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 60 60)" style="stroke:'+col+'"/><text x="60" y="68" text-anchor="middle" font-size="28" font-weight="700" style="fill:var(--ink)">'+p+'%</text></svg>'}
async function tShare(text){try{if(navigator.share){await navigator.share({title:"Nemischa test",text});return"ok"}}catch(e){if(e&&e.name==="AbortError")return"cancel"}
try{await navigator.clipboard.writeText(text);return"copied"}catch(e){}
try{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(ok)return"copied"}catch(e){}return"fail"}
function shareBtn(text){const b=h("button",{className:"btn t-sh",textContent:"Natijani ulashish"}),w=h("div");b.onclick=async()=>{const r=await tShare(text);if(r==="copied")b.textContent="Nusxalandi ✓";else if(r==="ok")b.textContent="Ulashildi ✓";else if(r==="fail"){b.textContent="Matnni qo’lda nusxalang";w.innerHTML="";w.appendChild(h("textarea",{className:"t-ta",readOnly:true,value:text,rows:5}))}};w.appendChild(b);return w}
function tEnd(app){const N=T.qs.length,p=pct(T.ok,N),msg=p===100?"A’lo! Mukammal natija.":p>=80?"Juda yaxshi!":p>=60?"Yaxshi, lekin xatolarni ko’rib chiqing.":p>=40?"O’rtacha. Qoidani qayta o’qib, yana urinib ko’ring.":"Hali qiyin. Qoidani o’qing va qayta yeching, bu normal.";
const ks=Object.keys(T.by).map(Number).sort((a,b)=>a-b);
app.appendChild(h("div",{className:"t-res"},[h("div",{innerHTML:donut(p)}),h("div",{className:"t-rm",textContent:msg}),h("div",{className:"t-chips"},[h("span",{className:"t-c ok",textContent:"✓ "+T.ok+" to’g’ri"}),h("span",{className:"t-c bad",textContent:"✗ "+(N-T.ok)+" xato"}),h("span",{className:"t-c",textContent:"⏱ "+mmss(T.t1-T.t0)})])]));
app.appendChild(shareBtn("📘 Nemischa test natijam\n✅ "+T.ok+"/"+N+" — "+p+"%\n📚 Darslar: "+T.sel.join(", ")+"\n🎚 Daraja: "+LVN[T.lv]+"  ⏱ "+mmss(T.t1-T.t0)));
app.appendChild(h("div",{className:"t-hh",textContent:"Darajalar bo’yicha"}));
[1,2,3].forEach(l=>{const b=T.byl[l];if(b)app.appendChild(h("div",{className:"t-br"},[h("span",{textContent:LVN[l]}),h("div",{className:"t-bt"},[h("i",{style:"width:"+pct(b.ok,b.t)+"%;background:"+LVC[l]})]),h("span",{textContent:b.ok+"/"+b.t})]))});
if(ks.length>1){app.appendChild(h("div",{className:"t-hh",textContent:"Darslar bo’yicha"}));ks.forEach(k=>{const b=T.by[k],pp=pct(b.ok,b.t);app.appendChild(h("div",{className:"t-br"},[h("span",{textContent:k+"-dars"}),h("div",{className:"t-bt"},[h("i",{style:"width:"+pp+"%;background:"+(pp>=80?"var(--ok)":pp>=50?"var(--warn)":"var(--bad)")})]),h("span",{textContent:b.ok+"/"+b.t})]))})}
if(T.bad.length){app.appendChild(h("div",{className:"t-hh",textContent:"Xatolar ("+T.bad.length+")"}));
T.bad.forEach(x=>app.appendChild(h("div",{className:"mi"},[h("div",{textContent:x.it.q}),h("div",{className:"x",textContent:"Sizning javob: "+x.pick}),h("div",{className:"v",textContent:"To’g’ri: "+x.it.a}),h("details",{style:"margin-top:6px"},[h("summary",{className:"hint",textContent:x.it.n+(x.it.w?"-dars: Wörter":"-dars qoidasi")}),ruleBox(x.it.n,x.it)])])));
app.appendChild(h("button",{className:"btn t-go",textContent:"Xatolarni qayta yechish",onclick:()=>startTest(shuffle(T.bad.map(x=>x.it)))}))}
app.appendChild(h("button",{className:"btn ghost",textContent:"Shu sozlamalar bilan yangi test",onclick:()=>startTest()}));
app.appendChild(h("button",{className:"btn ghost",textContent:"Sozlamalarga qaytish",onclick:()=>{T.ph="s";render()}}))}

build(false);
</script>
